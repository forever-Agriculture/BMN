appId: dev.bmn.desktop
productName: BMN
directories:
  output: release
files:
  - out/**/*
  - '!node_modules/node-pty/prebuilds/**/*'
  - '!node_modules/node-pty/build/Release/obj.target/**/*'
  # Keep exclusions in this file set: a separate linux.files exclusion creates a
  # catch-all matcher that includes old releases when packaging into staging.
  - '!node_modules/better-sqlite3/prebuilds/!(linux-${arch}).node'
asar: true
asarUnpack:
  - node_modules/node-pty/build/Release/pty.node
# Built by `pnpm run voice:build`; read at runtime from process.resourcesPath/whisper.
extraResources:
  - from: resources/terminfo/x/xterm-sixel-256color
    to: terminfo/x/xterm-sixel-256color
  - from: resources/whisper
    to: whisper
  # The bmn CLI that sessions find on PATH: a launcher plus the script it runs on the bundled runtime.
  - from: resources/cli/bmn
    to: bin/bmn
  - from: bin/codex
    to: bin/codex
  - from: bin/bmn-bashrc
    to: bin/bmn-bashrc
  - from: bin/bmn
    to: bin/bmn.mjs
  # bmn.mjs imports it by relative path; the utility process bundles its own copy.
  - from: bin/safe-config-write.mjs
    to: bin/safe-config-write.mjs
  - from: bin/text-diff.mjs
    to: bin/text-diff.mjs
  # Epic 60: the roster, approval-state reader, dispatch check and rules master that bmn.mjs imports.
  - from: bin/agents-roster.mjs
    to: bin/agents-roster.mjs
  - from: bin/agents-state.mjs
    to: bin/agents-state.mjs
  - from: bin/agents-cli.mjs
    to: bin/agents-cli.mjs
  - from: bin/agents-check.mjs
    to: bin/agents-check.mjs
  - from: bin/agents-rules.mjs
    to: bin/agents-rules.mjs
  # The prompt guard and the context, skills and tools commands; agents-check.mjs imports two of them,
  # so without these the dispatch check does not load either. scripts/lib/cli-modules.mjs finds the set.
  - from: bin/agents-guard.mjs
    to: bin/agents-guard.mjs
  - from: bin/agents-context.mjs
    to: bin/agents-context.mjs
  - from: bin/agents-skills.mjs
    to: bin/agents-skills.mjs
  - from: bin/agents-tools.mjs
    to: bin/agents-tools.mjs
  - from: bin/agents-tool-files.mjs
    to: bin/agents-tool-files.mjs
  # `bmn roster fence` runs the very command a research run is, so it loads the research module too.
  - from: bin/agents-research.mjs
    to: bin/agents-research.mjs
  # Epic 69: which hook events mark a turn's start and end; `bmn hook` and `bmn hooks check` load it.
  - from: bin/turn-marks.mjs
    to: bin/turn-marks.mjs
  - from: bin/agents-ask.mjs
    to: bin/agents-ask.mjs
  - from: bin/agents-fence.mjs
    to: bin/agents-fence.mjs
  # Epic 70: BMN's folder for OpenCode helper runs, its agent and the one `opencode run` form the check reads.
  - from: bin/agents-opencode.mjs
    to: bin/agents-opencode.mjs
  # A research run is started under this file as a program of its own, by the command line and by the app alike.
  - from: bin/agents-supervised.mjs
    to: bin/agents-supervised.mjs
  - from: bin/agents-judge.mjs
    to: bin/agents-judge.mjs
  # Epic 72: a teammate's ask: the measured form of each app, its inputs, the resolver, the run's own
  # supervisor (started as a program, like agents-supervised.mjs) and the one git a teammate's history reads run.
  - from: bin/agents-team-forms.mjs
    to: bin/agents-team-forms.mjs
  - from: bin/agents-team-inputs.mjs
    to: bin/agents-team-inputs.mjs
  - from: bin/agents-team-resolve.mjs
    to: bin/agents-team-resolve.mjs
  - from: bin/agents-team-ask.mjs
    to: bin/agents-team-ask.mjs
  - from: bin/agents-team-run.mjs
    to: bin/agents-team-run.mjs
  - from: bin/agents-team-cli.mjs
    to: bin/agents-team-cli.mjs
  - from: bin/agents-team-supervisor.mjs
    to: bin/agents-team-supervisor.mjs
  - from: bin/agents-team-places.mjs
    to: bin/agents-team-places.mjs
  - from: bin/agents-team-pictures.mjs
    to: bin/agents-team-pictures.mjs
  # bmn.mjs loads it first for every command: a command inside a teammate's run is refused.
  - from: bin/agents-team-nested.mjs
    to: bin/agents-team-nested.mjs
  - from: bin/ask-git.sh
    to: bin/ask-git.sh
  - from: bin/agents-team-browser.mjs
    to: bin/agents-team-browser.mjs
  - from: bin/ask-browser-relay.mjs
    to: bin/ask-browser-relay.mjs
  - from: bin/ask-browser-config.json
    to: bin/ask-browser-config.json
  # Epic 77: `bmn plan`, the project's plan and board; the app bundles its own copy of the reader.
  - from: bin/plan-cli.mjs
    to: bin/plan-cli.mjs
  - from: bin/plan-board.mjs
    to: bin/plan-board.mjs
  # Story 77.4: BMN's own skills and the module that installs them into the skills folder at start.
  - from: bin/agents-own-skills.mjs
    to: bin/agents-own-skills.mjs
  - from: ../../skills
    to: skills
    filter:
      - '**/*'
      - '!**/__pycache__/**'
  # The --self-test stand-in agents draw these recorded dialogs; the packaged smoke runs that phase too.
  - from: src/utility/test-fixtures/remote-answers
    to: self-test/remote-answers
npmRebuild: false
# better-sqlite3 loads prebuilds/<platform>-<arch>.node, which is where @electron/rebuild puts its
# from-source build; every other prebuild it ships is dead weight, so the target keeps only its own.
linux:
  target:
    - dir
  executableName: bmn
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/linux-*.node
    - node_modules/node-pty/bin/linux-*/node-pty.node
