appId: dev.bmn.desktop
productName: BMN
directories:
  output: release
files:
  - out/**/*
  - '!node_modules/node-pty/prebuilds/**/*'
  - '!node_modules/node-pty/build/Release/obj.target/**/*'
asar: true
asarUnpack:
  - node_modules/node-pty/build/Release/pty.node
# Built by `pnpm run voice:build`; read at runtime from process.resourcesPath/whisper.
extraResources:
  - from: resources/whisper
    to: whisper
  # The bmn CLI that sessions find on PATH: a launcher plus the script it runs on the bundled runtime.
  - from: resources/cli/bmn
    to: bin/bmn
  - from: bin/bmn
    to: bin/bmn.mjs
npmRebuild: false
# better-sqlite3 loads prebuilds/<platform>-<arch>.node, which is where @electron/rebuild puts its
# from-source build; every other prebuild it ships is dead weight, so each target keeps only its own.
linux:
  target:
    - dir
  executableName: bmn
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(linux-${arch}).node'
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/linux-*.node
    - node_modules/node-pty/bin/linux-*/node-pty.node
mac:
  target:
    - dir
  category: public.app-category.developer-tools
  icon: resources/icons/hicolor/512x512.png
  # A `dir` build is for this computer, so it is ad-hoc signed rather than signed for distribution.
  identity: null
  extendInfo:
    # macOS shows this sentence when Hold Space first asks for the microphone.
    NSMicrophoneUsageDescription: BMN transcribes dictation on this computer, so nothing you say leaves it.
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}).node'
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/darwin-*.node
    - node_modules/node-pty/bin/darwin-*/node-pty.node
    # node-pty forks through this helper on macOS, so it must be a real executable file on disk.
    - node_modules/node-pty/build/Release/spawn-helper
