appId: dev.bmn.desktop
productName: BMN
directories:
  output: release
files:
  - out/**/*
  - '!node_modules/node-pty/prebuilds/**/*'
  - '!node_modules/node-pty/build/Release/obj.target/**/*'
  # Keep exclusions in this file set: a separate linux.files exclusion creates a
  # catch-all matcher that includes old releases when packaging into staging.
  - '!node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}).node'
asar: true
asarUnpack:
  - node_modules/node-pty/build/Release/pty.node
# Built by `pnpm run voice:build`; read at runtime from process.resourcesPath/whisper.
extraResources:
  - from: resources/whisper
    to: whisper
  - from: resources/terminfo/x/xterm-sixel-256color
    to: terminfo/x/xterm-sixel-256color
  # The bmn CLI that sessions find on PATH: a launcher plus the script it runs on the bundled runtime.
  - from: bin/bmn
    to: bin/bmn.mjs
  # bmn.mjs imports it by relative path; the utility process bundles its own copy.
  - from: bin/safe-config-write.mjs
    to: bin/safe-config-write.mjs
  - from: bin/windows-env.mjs
    to: bin/windows-env.mjs
  # The --self-test stand-in agents draw these recorded dialogs; the packaged smoke runs that phase too.
  - from: src/utility/test-fixtures/remote-answers
    to: self-test/remote-answers
npmRebuild: false
afterPack: ./build/windows-after-pack.mjs
afterAllArtifactBuild: ./build/windows-after-all-artifacts.mjs
# better-sqlite3 loads prebuilds/<platform>-<arch>.node, which is where @electron/rebuild puts its
# from-source build; every other prebuild it ships is dead weight, so the target keeps only its own.
linux:
  extraResources:
    - from: resources/cli/bmn
      to: bin/bmn
    - from: bin/codex
      to: bin/codex
    - from: bin/bmn-bashrc
      to: bin/bmn-bashrc
  target:
    - dir
  executableName: bmn
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/linux-*.node
    - node_modules/node-pty/bin/linux-*/node-pty.node
# Native-host unpacked artifact; pinned portable voice engines ship on both OSes.
# Native-host builds only: ${platform} deliberately names the host ABI.
win:
  # The native bmn and codex launchers (scripts/build/windows-cli.mjs); no Unix shell launchers.
  # codex.exe runs codex.mjs, which keeps Codex typed in a session off its shared daemon.
  extraResources:
    - from: native-out/windows-cli/bmn.exe
      to: bin/bmn.exe
    - from: native-out/windows-cli/codex.exe
      to: bin/codex.exe
    - from: bin/codex.mjs
      to: bin/codex.mjs
    - from: bin/codex-launch.mjs
      to: bin/codex-launch.mjs
    - from: bin/windows-launch.mjs
      to: bin/windows-launch.mjs
    - from: native-out/windows-install
      to: install
      filter:
        - worker.cjs
        - BMN-launcher.exe
        - BMN-install-runner.exe
        - BMN-shortcut.exe
        - BMN.ico
  target:
    - dir
  executableName: BMN
  signAndEditExecutable: false
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/win32-*.node
    - node_modules/node-pty/bin/win32-*/node-pty.node
    - node_modules/node-pty/build/Release/*.node
    - node_modules/node-pty/build/Release/*.dll
    - node_modules/node-pty/build/Release/*.exe
    - node_modules/node-pty/build/Release/conpty/**
