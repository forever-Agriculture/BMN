# The project's board: one line per epic and story. Edit it by hand whenever you like; agents change one row
# at a time with `bmn plan set`. Statuses: backlog, ready (go recorded), in-progress, review, blocked, paused,
# done, dropped. A note is at most 160 characters; blocked, paused and dropped need one (the reason). An empty
# line separates one epic's rows from the next.
format: bmn-plan
schema_version: 1
# The order of unfinished epics: every ready epic is here, nothing done or dropped.
queue:
  - <N>
development_status:
  epic-<N>: backlog # Suggested lead: <from `bmn roster role lead`> · <short note>
  <N>-1-<slug>: backlog

  epic-<N+1>: backlog # Suggested lead: <from `bmn roster role lead`> · <short note>
  <N+1>-1-<slug>: backlog
