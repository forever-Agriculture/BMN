# MODULE: plan/allowances/NNN.yaml - what a run of Epic N may use. Set at planning, read by `bmn plan allowances N`, changed by `bmn plan allow`
schema: 1
epic: <N>
limits:
  repair_rounds: {limit: 4, ceiling: 8, per: boundary}
  full_reviews: {limit: 1, ceiling: 2, per: boundary}
  rechecks: {limit: 2, ceiling: 4, per: boundary}
  consults: {limit: 3, ceiling: 6, per: epic}
  senior_consults: {limit: 1, ceiling: 2, per: epic}
  qa_passes: {limit: 2, ceiling: 4, per: epic}
  test_hours: {limit: 4, ceiling: 8, per: epic, unit: hours}
  money_usd: {limit: 0, per: epic, unit: usd}
may:
  - "remove this run's own worktrees after delivery, once merged, clean and archived"
stays_out:
  - production
  - customer data
deferrable: []
messages: []
prepared: []
