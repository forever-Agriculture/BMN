packages:
  - apps/*
  - shared/*

engineStrict: true
saveExact: true

# Refuse versions published in the last three days: a compromised npm release is usually pulled by then.
minimumReleaseAge: 4320

allowBuilds:
  electron: true
  node-pty: true
  better-sqlite3: true
  esbuild: true
  electron-builder: true
  electron-winstaller: false

onlyBuiltDependencies:
  - electron
  - node-pty
  - better-sqlite3
  - esbuild
  - electron-builder
# Keep Sixel on the same presentation path as terminal text (Epic 87).
patchedDependencies:
  '@xterm/addon-image@0.9.0': patches/@xterm__addon-image@0.9.0.patch
  playwright-core@1.61.0-alpha-1778188671000: patches/playwright-core@1.61.0-alpha-1778188671000.patch
