packages:
  - apps/*
  - shared/*

engineStrict: true
saveExact: true

# Refuse versions published in the last three days: a compromised npm release is usually pulled by then.
minimumReleaseAge: 4320

allowBuilds:
  electron: true
  node-pty: true
  better-sqlite3: true
  esbuild: true
  electron-builder: true
  electron-winstaller: false

onlyBuiltDependencies:
  - electron
  - node-pty
  - better-sqlite3
  - esbuild
  - electron-builder
