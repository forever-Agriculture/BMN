name: Windows Chromium ACL diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/windows-cache-probe.yml
      - scripts/test/windows-cache-acl-probe.mjs
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned Electron only
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP 'bmn-electron-acl-probe'
          npm install --prefix $probeDir --ignore-scripts --no-audit --no-fund electron@44.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $probeDir 'node_modules/electron/install.js')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BMN_PROBE_ELECTRON=$(Join-Path $probeDir 'node_modules/electron/dist/electron.exe')" >> $env:GITHUB_ENV
      - name: Inspect synthetic Chromium cache ACL
        run: node scripts/test/windows-cache-acl-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cache-acl
          path: test-results/
          retention-days: 7
