name: Windows root diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/windows-root-probe.yml
      - scripts/test/windows-root-probe.mjs
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Capture actual Windows root helper failure
        run: node scripts/test/windows-root-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-root-probe
          path: test-results/
          retention-days: 7
